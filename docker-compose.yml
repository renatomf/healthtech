# Sobe banco, API e web com `docker compose up -d`. Nenhum arquivo de configuração é obrigatório:
# todos os valores abaixo têm padrão de desenvolvimento. Para trocar algum, crie um `.env`
# (copie de `.env.example`); o Compose lê esse arquivo sozinho.

x-db: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-clinic}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinic_dev_password}
  POSTGRES_DB: ${POSTGRES_DB:-clinic}

services:
  db:
    image: postgres:17-alpine
    environment: *db-env
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: api
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-clinic}:${POSTGRES_PASSWORD:-clinic_dev_password}@db:5432/${POSTGRES_DB:-clinic}
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: ${API_PORT:-3333}
      # Valor de desenvolvimento. Em produção, defina um segredo aleatório no .env.
      JWT_SECRET: ${JWT_SECRET:-troque-por-um-segredo-aleatorio-de-pelo-menos-32-bytes} # gitleaks:allow
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5173}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE:-America/Sao_Paulo}
      CLINIC_OPEN_TIME: ${CLINIC_OPEN_TIME:-08:00}
      CLINIC_CLOSE_TIME: ${CLINIC_CLOSE_TIME:-18:00}
    ports:
      - "${API_PORT:-3333}:${API_PORT:-3333}"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3333}
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db-data:
