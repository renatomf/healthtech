packages:
  - apps/*
  - packages/*

# Scripts de instalação liberados explicitamente (pnpm bloqueia por padrão).
allowBuilds:
  esbuild: true # binário usado pelo drizzle-kit
  cpu-features: false # opcional do ssh2 (Testcontainers); não usado
  protobufjs: false # só checagem de versão no postinstall
  ssh2: false # Docker via SSH não é usado
